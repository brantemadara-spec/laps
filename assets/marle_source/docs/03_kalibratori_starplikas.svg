<text x="20" y="178" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="normal" fill="#162b3b" text-anchor="start">MITRĀ SPRAUGA ≈ izmērītais kalibrators + izmērītās papildu starplikas</text>
<text x="20" y="183.8" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="normal" fill="#162b3b" text-anchor="start">                                  − abu saspiesto marles gabalu kopējais biezums.</text>
<text x="20" y="189.6" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="normal" fill="#162b3b" text-anchor="start">3 mm piemērs: 0,4 + 0,5 + 1,0 + 1,5 − 0,4 = 3,0 mm.</text>
<text x="20" y="195.4" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="normal" fill="#162b3b" text-anchor="start">Piemērā 0,4 mm marles kopā ir pieņēmums, ne marles īpašība.</text>
<text x="20" y="201.2" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="normal" fill="#162b3b" text-anchor="start">Izmēri visu gredzenu paku četros stūros; pirmās kārtas kļūdas summējas.</text>
<text x="20" y="207" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="normal" fill="#162b3b" text-anchor="start">Ja esošie kalibratori neder, maini kalibratora biezumu Blender kodā.</text>
<text x="220" y="208" font-family="Arial,Helvetica,sans-serif" font-size="2.99861" font-weight="normal" fill="#162b3b" text-anchor="start">*Tabula der, ja izmērītais kalibrators kompensē izmērīto marli.</text>
<text x="220" y="213.5" font-family="Arial,Helvetica,sans-serif" font-size="2.99861" font-weight="normal" fill="#162b3b" text-anchor="start">Otra marles kārta katrā pusē prasa jaunu kalibrēšanu.</text>
<text x="220" y="219" font-family="Arial,Helvetica,sans-serif" font-size="2.99861" font-weight="normal" fill="#162b3b" text-anchor="start">Fiziskais gredzena biezums nav sausās kartes biezums.</text>
<text x="20" y="252" font-family="Arial,Helvetica,sans-serif" font-size="3.10444" font-weight="normal" fill="#64727c" text-anchor="start">Kalibratoru pieskaita vienu reizi visai pakai. Taisnas, tīras saskares virsmas; pārbaudi plakanumu un faktisko biezumu.</text>
