<text x="220" y="47" font-family="Arial,Helvetica,sans-serif" font-size="3.88056" font-weight="bold" fill="#235875" text-anchor="start">DRUKĀJAMAIS KOMPLEKTS</text>
<text x="220" y="54.5" font-family="Arial,Helvetica,sans-serif" font-size="3.42194" font-weight="normal" fill="#162b3b" text-anchor="start">Kalibratori 0,2 / 0,4 / 0,6 / 0,8 mm: pa vienam. Izvēlies VIENU, kas atbilst abu saspiesto marles gabalu</text>
<text x="220" y="59.7" font-family="Arial,Helvetica,sans-serif" font-size="3.42194" font-weight="normal" fill="#162b3b" text-anchor="start">kopējam biezumam. Visus četrus reizē neliek.</text>
<text x="220" y="67.9" font-family="Arial,Helvetica,sans-serif" font-size="3.42194" font-weight="normal" fill="#162b3b" text-anchor="start">Papildu starplikas 0,5 / 1,0 / 1,5 mm: pa divām. Visām kontūra 130 × 100 R6, atvērums 85 × 55 R3 un</text>
<text x="220" y="73.1" font-family="Arial,Helvetica,sans-serif" font-size="3.42194" font-weight="normal" fill="#162b3b" text-anchor="start">4 × Ø6,6.</text>
