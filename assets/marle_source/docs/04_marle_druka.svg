<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="100%" height="100%" fill="white"/>
<text x="14" y="17" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="bold" fill="#235875" text-anchor="start">LAPS MARLE / PĀRSTRĀDĀTS PAPĪRS UN RUDENS LAPAS</text>
<text x="14" y="27" font-family="Arial,Helvetica,sans-serif" font-size="5.64444" font-weight="bold" fill="#162b3b" text-anchor="start">MARLE / PIEGRIEŠANA UN PETG DRUKA</text>
<text x="196" y="16" font-family="Arial,Helvetica,sans-serif" font-size="2.82222" font-weight="normal" fill="#64727c" text-anchor="end">LAPS MARLE / RASĒJUMU REDAKCIJA C</text>
<line x1="14" y1="33" x2="196" y2="33" stroke="#235875" stroke-width="0.5"/>
<line x1="14" y1="267" x2="196" y2="267" stroke="#235875" stroke-width="0.35"/>
<text x="14" y="275" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="start">VISI IZMĒRI mm | KONCEPCIJAS NOMINĀLIE IZMĒRI</text>
<text x="14" y="282" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="start">Shēmisks mērogs; izmēri ir noteicošie</text>
<text x="196" y="282" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="end">LAPA 04 / 08 | 07.10.2026.</text>
<rect x="62.75" y="44.75" width="84.5" height="54.5" rx="3" fill="none" stroke="#74888f" stroke-width="0.3"/>
<line x1="62.75" y1="99.25" x2="62.75" y2="110" stroke="#c4cdd3" stroke-width="0.16"/>
<line x1="147.25" y1="99.25" x2="147.25" y2="110" stroke="#c4cdd3" stroke-width="0.16"/>
<line x1="62.75" y1="108" x2="147.25" y2="108" stroke="#235875" stroke-width="0.16"/>
<polygon points="62.75,108 64.75,106.9 64.75,109.1" fill="#235875" stroke="#235875" stroke-width="0.15"/>
<polygon points="147.25,108 145.25,109.1 145.25,106.9" fill="#235875" stroke="#235875" stroke-width="0.15"/>
<text x="105" y="105.8" font-family="Arial,Helvetica,sans-serif" font-size="2.82222" font-weight="normal" fill="#235875" text-anchor="middle">84,5</text>
<line x1="147.25" y1="99.25" x2="159" y2="99.25" stroke="#c4cdd3" stroke-width="0.16"/>
<line x1="147.25" y1="44.75" x2="159" y2="44.75" stroke="#c4cdd3" stroke-width="0.16"/>
<line x1="157" y1="99.25" x2="157" y2="44.75" stroke="#235875" stroke-width="0.16"/>
<polygon points="157,99.25 155.9,97.25 158.1,97.25" fill="#235875" stroke="#235875" stroke-width="0.15"/>
<polygon points="157,44.75 158.1,46.75 155.9,46.75" fill="#235875" stroke="#235875" stroke-width="0.15"/>
<text x="154.5" y="72" font-family="Arial,Helvetica,sans-serif" font-size="2.82222" font-weight="normal" fill="#235875" text-anchor="middle" transform="rotate(-90 154.5 72)">54,5</text>
<text x="105" y="70" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="bold" fill="#235875" text-anchor="middle">2 gabali / stūri R3</text>
<text x="18" y="120" font-family="Arial,Helvetica,sans-serif" font-size="4.05694" font-weight="bold" fill="#235875" text-anchor="start">Marle aizstāj pērkamo smalko sietu</text>
<text x="18" y="127.5" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">Parasta neimpregnēta 100% kokvilnas marle. Sākumā viena izlocīta, gluda kārta katrā kartes</text>
<text x="18" y="132.6" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">pusē. Izgriez 2 gabalus 84,5 × 54,5 mm ar R3 stūriem; marle paliek tikai kartes atvērumā, ne uz</text>
<text x="18" y="137.7" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">gredzenu atdurēm.</text>
<text x="18" y="145.8" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">Pirms kalibrēšanas marli izskalo un izžāvē plakaniski. Tā nav kalibrēts 100–200 µm filtrs. Vispirms</text>
<text x="18" y="150.9" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">ar nelielu papīra masas porciju pārbaudi, vai notekūdenī neizskalojas šķiedras. Ja vajag blīvāku</text>
<text x="18" y="156" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">marli vai otru kārtu, atkārto biezuma mērījumu.</text>
<text x="18" y="164.1" font-family="Arial,Helvetica,sans-serif" font-size="4.05694" font-weight="bold" fill="#235875" text-anchor="start">Drukas iestatījumi</text>
<text x="18" y="171.6" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">ELEGOO Centauri Carbon pieņēmums: 0,4 mm sprausla; parasts PETG Ø1,75. Plāksnes: 0,20 mm</text>
<text x="18" y="176.7" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">kārta, vismaz 6 sienas, 100% pildījums. Temperatūras izvēlas pēc konkrētā filamenta norādēm.</text>
<text x="18" y="184.8" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">Kalibratori un starplikas: 0,10 mm kārta, 100% pildījums. Pirmās kārtas un kopējā biezuma</text>
<text x="18" y="189.9" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">vērtības pārbaudi slicerī un ar mērinstrumentu. Aizmuguri drukā lejā; pārbaudi 1,6 mm rievu īsos</text>
<text x="18" y="195" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">tiltus un ūdens izejas.</text>
<text x="18" y="203.1" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">Noņem diegus un atskabargas. Marlei un starplikām saskares plaknes atstāj gludas: “fuzzy skin”</text>
<text x="18" y="208.2" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">neieslēdz. Marle pati var atstāt redzamu pinuma rakstu; minimāli pūkaina virsma jānovērtē ar</text>
<text x="18" y="213.3" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">reālu paraugu.</text>
</svg>
