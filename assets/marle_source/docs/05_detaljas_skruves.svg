<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<rect width="100%" height="100%" fill="white"/>
<text x="14" y="17" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="bold" fill="#235875" text-anchor="start">LAPS MARLE / PĀRSTRĀDĀTS PAPĪRS UN RUDENS LAPAS</text>
<text x="14" y="27" font-family="Arial,Helvetica,sans-serif" font-size="5.64444" font-weight="bold" fill="#162b3b" text-anchor="start">DETAĻU SARAKSTS / M6 × 40 GARUMA PĀRBAUDE</text>
<text x="406" y="16" font-family="Arial,Helvetica,sans-serif" font-size="2.82222" font-weight="normal" fill="#64727c" text-anchor="end">LAPS MARLE / RASĒJUMU REDAKCIJA C</text>
<line x1="14" y1="33" x2="406" y2="33" stroke="#235875" stroke-width="0.5"/>
<line x1="14" y1="267" x2="406" y2="267" stroke="#235875" stroke-width="0.35"/>
<text x="14" y="275" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="start">VISI IZMĒRI mm | KONCEPCIJAS NOMINĀLIE IZMĒRI</text>
<text x="14" y="282" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="start">Shēmisks mērogs; izmēri ir noteicošie</text>
<text x="406" y="282" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="end">LAPA 05 / 08 | 07.10.2026.</text>
<text x="20" y="48" font-family="Arial,Helvetica,sans-serif" font-size="3.88056" font-weight="bold" fill="#235875" text-anchor="start">DRUKĀT UN PIEGRIEZT</text>
<text x="20" y="55.5" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">PETG plāksne 130 × 100 × 10 R6 — 2 gabali; abas vienādas.</text>
<text x="20" y="64.2" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">Kalibratori 0,2 / 0,4 / 0,6 / 0,8 mm — pa 1; salikumā izvēlas tikai vienu.</text>
<text x="20" y="72.9" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">Starplikas 0,5 / 1,0 / 1,5 mm — pa 2; izvēlas vajadzīgo paku.</text>
<text x="20" y="81.6" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">Kokvilnas marle 84,5 × 54,5 R3 — 2 gabali, sākumā 1 kārta katrā pusē.</text>
<text x="20" y="92.3" font-family="Arial,Helvetica,sans-serif" font-size="3.88056" font-weight="bold" fill="#235875" text-anchor="start">PIRKT VAI IZMANTOT ESOŠO</text>
<text x="20" y="99.8" font-family="Arial,Helvetica,sans-serif" font-size="3.45722" font-weight="normal" fill="#162b3b" text-anchor="start">4 × M6 × 40 pilnas vītnes metāla skrūves DIN 933 / ISO 4017. Garumu mēra zem galvas; vēlams</text>
<text x="20" y="105.3" font-family="Arial,Helvetica,sans-serif" font-size="3.45722" font-weight="normal" fill="#162b3b" text-anchor="start">cinkotas 8.8.</text>
<text x="20" y="113.8" font-family="Arial,Helvetica,sans-serif" font-size="3.45722" font-weight="normal" fill="#162b3b" text-anchor="start">4 × M6 metāla uzgriežņi DIN 934 / ISO 4032; standarta augstuma pieņēmums 5,2 mm.</text>
<text x="20" y="122.3" font-family="Arial,Helvetica,sans-serif" font-size="3.45722" font-weight="normal" fill="#162b3b" text-anchor="start">8 × M6 platas metāla paplāksnes DIN 9021: iekšējais Ø6,4, ārējais Ø18, biezums 1,6. Pa vienai zem</text>
<text x="20" y="127.8" font-family="Arial,Helvetica,sans-serif" font-size="3.45722" font-weight="normal" fill="#162b3b" text-anchor="start">galvas un uzgriežņa.</text>
<text x="20" y="136.3" font-family="Arial,Helvetica,sans-serif" font-size="3.45722" font-weight="normal" fill="#162b3b" text-anchor="start">1 parastas kokvilnas marles iepakojums; PETG Ø1,75 mm spole, ja esošā materiāla nepietiek.</text>
<rect x="245" y="113" width="60" height="20" fill="#d7ebef" stroke="#162b3b" stroke-width="0.3"/>
<rect x="245" y="86.2" width="60" height="20" fill="#d7ebef" stroke="#162b3b" stroke-width="0.3"/>
<rect x="245" y="106.2" width="60" height="6.8" fill="#f0d8b4" stroke="#162b3b" stroke-width="0.2"/>
<rect x="257" y="83" width="36" height="3.2" fill="#dfe2e5" stroke="#64727c" stroke-width="0.2"/>
<rect x="257" y="133" width="36" height="3.2" fill="#dfe2e5" stroke="#64727c" stroke-width="0.2"/>
<rect x="265" y="136.2" width="20" height="10.4" fill="#dfe2e5" stroke="#64727c" stroke-width="0.3"/>
<rect x="269" y="83" width="12" height="80" fill="#dfe2e5" stroke="#64727c" stroke-width="0.2"/>
<rect x="265" y="75" width="20" height="8" fill="#dfe2e5" stroke="#64727c" stroke-width="0.3"/>
<line x1="285" y1="163" x2="328" y2="163" stroke="#c4cdd3" stroke-width="0.16"/>
<line x1="285" y1="83" x2="328" y2="83" stroke="#c4cdd3" stroke-width="0.16"/>
<line x1="326" y1="163" x2="326" y2="83" stroke="#235875" stroke-width="0.16"/>
<polygon points="326,163 324.9,161 327.1,161" fill="#235875" stroke="#235875" stroke-width="0.15"/>
<polygon points="326,83 327.1,85 324.9,85" fill="#235875" stroke="#235875" stroke-width="0.15"/>
<text x="323.5" y="123" font-family="Arial,Helvetica,sans-serif" font-size="2.82222" font-weight="normal" fill="#235875" text-anchor="middle" transform="rotate(-90 323.5 123)">40 / garums zem galvas</text>
<polyline points="293,85 337,72 349,72" fill="none" stroke="#235875" stroke-width="0.18"/>
<polygon points="293,85 294.446,83.5405 295.007,85.4394" fill="#235875" stroke="#235875" stroke-width="0.15"/>
<text x="350" y="71" font-family="Arial,Helvetica,sans-serif" font-size="2.82222" font-weight="normal" fill="#235875" text-anchor="start">Galva un paplāksne augšā</text>
<polyline points="285,142 337,133 349,133" fill="none" stroke="#235875" stroke-width="0.18"/>
<polygon points="285,142 286.605,140.718 286.942,142.669" fill="#235875" stroke="#235875" stroke-width="0.15"/>
<text x="350" y="132" font-family="Arial,Helvetica,sans-serif" font-size="2.82222" font-weight="normal" fill="#235875" text-anchor="start">Uzgrieznis un paplāksne apakšā</text>
<text x="224" y="52" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="bold" fill="#235875" text-anchor="start">SKRŪVES NOVIETOJUMS / GALVA AUGŠĀ</text>
<text x="223" y="169" font-family="Arial,Helvetica,sans-serif" font-size="3.24556" font-weight="normal" fill="#162b3b" text-anchor="start">3 mm mitras spraugas piemērs:</text>
<text x="223" y="174.7" font-family="Arial,Helvetica,sans-serif" font-size="3.24556" font-weight="normal" fill="#162b3b" text-anchor="start">20 plāksnes + 3,4 paka + 3,2 paplāksnes + 5,2 uzgrieznis</text>
<text x="223" y="180.4" font-family="Arial,Helvetica,sans-serif" font-size="3.24556" font-weight="normal" fill="#162b3b" text-anchor="start">= 31,8 mm līdz uzgriežņa ārpusei; 40 − 31,8 = 8,2 mm gals.</text>
<text x="223" y="186.1" font-family="Arial,Helvetica,sans-serif" font-size="3.24556" font-weight="normal" fill="#162b3b" text-anchor="start">Maksimālais parādītais salikums: 20 + 5 + 0,8 + 3,2 + 5,2</text>
<text x="223" y="191.8" font-family="Arial,Helvetica,sans-serif" font-size="3.24556" font-weight="normal" fill="#162b3b" text-anchor="start">= 34,2 mm; M6 × 40 atlikums 5,8 mm.</text>
<text x="223" y="197.5" font-family="Arial,Helvetica,sans-serif" font-size="3.24556" font-weight="normal" fill="#162b3b" text-anchor="start">Pārbaudi nopirkto paplāksņu un uzgriežņa reālos izmērus.</text>
<text x="223" y="203.2" font-family="Arial,Helvetica,sans-serif" font-size="3.24556" font-weight="normal" fill="#162b3b" text-anchor="start">Apakšējā balstā atstāj vietu uzgriežņiem un vītnes galiem.</text>
<text x="20" y="243" font-family="Arial,Helvetica,sans-serif" font-size="3.10444" font-weight="normal" fill="#64727c" text-anchor="start">DEPO Berģi: precīza M6 × 40 / marles cena un atlikums nav apstiprināti. Aktuālos avotus un alternatīvu cenas skatīt iepirkuma PDF.</text>
<text x="20" y="248.5" font-family="Arial,Helvetica,sans-serif" font-size="3.10444" font-weight="normal" fill="#64727c" text-anchor="start">Jaunajā sarakstā nav tērauda atbalstu, eņģes/M4 detaļu, poliestera sieta vai 8 skrūvju komplekta.</text>
</svg>
