<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="100%" height="100%" fill="white"/>
<text x="14" y="17" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="bold" fill="#235875" text-anchor="start">LAPS MARLE / PĀRSTRĀDĀTS PAPĪRS UN RUDENS LAPAS</text>
<text x="14" y="27" font-family="Arial,Helvetica,sans-serif" font-size="5.64444" font-weight="bold" fill="#162b3b" text-anchor="start">SALIKŠANA / MAIGA AIZVĒRŠANA UN DRENĀŽA</text>
<text x="196" y="16" font-family="Arial,Helvetica,sans-serif" font-size="2.82222" font-weight="normal" fill="#64727c" text-anchor="end">LAPS MARLE / RASĒJUMU REDAKCIJA C</text>
<line x1="14" y1="33" x2="196" y2="33" stroke="#235875" stroke-width="0.5"/>
<line x1="14" y1="267" x2="196" y2="267" stroke="#235875" stroke-width="0.35"/>
<text x="14" y="275" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="start">VISI IZMĒRI mm | KONCEPCIJAS NOMINĀLIE IZMĒRI</text>
<text x="14" y="282" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="start">Shēmisks mērogs; izmēri ir noteicošie</text>
<text x="196" y="282" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="end">LAPA 06 / 08 | 07.10.2026.</text>
<text x="18" y="45" font-family="Arial,Helvetica,sans-serif" font-size="4.05694" font-weight="bold" fill="#235875" text-anchor="start">Salikšanas secība</text>
<text x="18" y="52.5" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">1. Apakšējais PETG 10 mm: drenāžas rievas lejā. Uz balsta atstāj brīvas ūdens izejas un vietu</text>
<text x="18" y="57.6" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">apakšējiem uzgriežņiem.</text>
<text x="18" y="65.7" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">2. Kartes atvērumā uzliec apakšējo marli. Uzliec vienu izvēlēto kalibratoru un izmērīto papildu</text>
<text x="18" y="70.8" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">starpliku paku.</text>
<text x="18" y="78.9" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">3. Vienmērīgi iepildi slapjo papīra un lapu masu. Uzliec augšējo marli un identisko augšējo PETG</text>
<text x="18" y="84" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">plāksni, rievas uz augšu.</text>
<text x="18" y="92.1" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">4. Četros stūros ievieto M6 × 40 no augšas. Paplāksne zem katras galvas un katra apakšējā</text>
<text x="18" y="97.2" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">uzgriežņa. Kopā: 4 skrūves, 4 uzgriežņi, 8 paplāksnes.</text>
<text x="18" y="105.3" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">5. Pievelc ar roku pakāpeniski, pārmaiņus pa diagonāli. Kontrolē paralēlumu. Apstājies, kad</text>
<text x="18" y="110.4" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">starpliku paka vienmērīgi sēžas; nepievieno spēku tikai ar stiprāku pievilkšanu.</text>
<text x="18" y="118.5" font-family="Arial,Helvetica,sans-serif" font-size="4.05694" font-weight="bold" fill="#235875" text-anchor="start">Ko skrūves kontrolē</text>
<text x="18" y="126" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">Skrūves aizver formu līdz gredzenu atdurēm. Četri stūra stiprinājumi nekontrolē malas un centru</text>
<text x="18" y="131.1" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">tāpat kā iepriekšējais tērauda mezgls. Salīdzini kartes centra un malu biezumu; pēc darba</text>
<text x="18" y="136.2" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">pārbaudi plākšņu paliekošu lieci.</text>
<text x="18" y="144.3" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="bold" fill="#162b3b" text-anchor="start">Skrūves pievilkšanas moments nav masas spiediena mērījums. Pēc atdures daļu spēka</text>
<text x="18" y="149.4" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="bold" fill="#162b3b" text-anchor="start">nes PETG un gredzeni; kopējo ārējo spēku dalīt ar kartes laukumu kā masas spiedienu</text>
<text x="18" y="154.5" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="bold" fill="#162b3b" text-anchor="start">nevar.</text>
<text x="18" y="162.6" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">Šai 10 mm četru skrūvju formai nav pārbaudītas spiediena robežas. Sāc ar tukšo salikumu, ūdens</text>
<text x="18" y="167.7" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">testu un maigu papīra paraugu. Skolas preses spēka pētījums prasa atsevišķu slodzes un</text>
<text x="18" y="172.8" font-family="Arial,Helvetica,sans-serif" font-size="3.52778" font-weight="normal" fill="#162b3b" text-anchor="start">deformācijas pārbaudi. Strādā istabas temperatūrā.</text>
</svg>
