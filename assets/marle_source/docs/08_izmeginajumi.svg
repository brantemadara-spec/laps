<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="100%" height="100%" fill="white"/>
<text x="14" y="17" font-family="Arial,Helvetica,sans-serif" font-size="3.175" font-weight="bold" fill="#235875" text-anchor="start">LAPS MARLE / PĀRSTRĀDĀTS PAPĪRS UN RUDENS LAPAS</text>
<text x="14" y="27" font-family="Arial,Helvetica,sans-serif" font-size="5.64444" font-weight="bold" fill="#162b3b" text-anchor="start">IZMĒĢINĀJUMI / MARLES PINUMS UN KARTES IZTURĪBA</text>
<text x="196" y="16" font-family="Arial,Helvetica,sans-serif" font-size="2.82222" font-weight="normal" fill="#64727c" text-anchor="end">LAPS MARLE / RASĒJUMU REDAKCIJA C</text>
<line x1="14" y1="33" x2="196" y2="33" stroke="#235875" stroke-width="0.5"/>
<line x1="14" y1="267" x2="196" y2="267" stroke="#235875" stroke-width="0.35"/>
<text x="14" y="275" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="start">VISI IZMĒRI mm | KONCEPCIJAS NOMINĀLIE IZMĒRI</text>
<text x="14" y="282" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="start">Shēmisks mērogs; izmēri ir noteicošie</text>
<text x="196" y="282" font-family="Arial,Helvetica,sans-serif" font-size="2.46944" font-weight="normal" fill="#64727c" text-anchor="end">LAPA 08 / 08 | 07.10.2026.</text>
<text x="18" y="45" font-family="Arial,Helvetica,sans-serif" font-size="4.05694" font-weight="bold" fill="#235875" text-anchor="start">Sākuma pārbaudes</text>
<text x="18" y="52.5" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">Tukšā forma: gredzenu paka sēžas vienādi četros stūros; vāks nešūpojas. Uz mēreni</text>
<text x="18" y="57.9" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">noslogotas plāksnes pārbaudi centru un malas.</text>
<text x="18" y="66.3" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">Ūdens tests: nav aizsprostotu šūnu vai rievu. Marles tests: vai notekūdenī aiziet smalkās</text>
<text x="18" y="71.7" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">papīra šķiedras?</text>
<text x="18" y="80.1" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">Papīra kontrole bez lapām: maiga aizvēršana; pēc atlaišanas plāksnes paliek plakanas. Ja</text>
<text x="18" y="85.5" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">marle ieliecas, burzās vai zaudē šķiedras, koriģē audumu un kalibrēšanu.</text>
<text x="18" y="93.9" font-family="Arial,Helvetica,sans-serif" font-size="4.05694" font-weight="bold" fill="#235875" text-anchor="start">Salīdzināma eksperimentu sērija</text>
<text x="18" y="101.4" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">Sākumā maini vienu faktoru reizē. Receptes: papīrs/lapas 100/0, 90/10 un 80/20% no sausās</text>
<text x="18" y="106.8" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">izejvielas masas. Pieraksti papīra tipu, lapu sugu, sasmalcinājumu un vienādu presēšanas</text>
<text x="18" y="112.2" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">laiku.</text>
<text x="18" y="120.6" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">Pārbaudi 1, 3 un 5 mm mērītās mitrās spraugas, katrai receptei vismaz 3 paraugus. Marles</text>
<text x="18" y="126" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">kārtu skaitu salīdzini atsevišķā sērijā un katrreiz no jauna nomēri abu saspiesto kārtu biezumu.</text>
<text x="18" y="134.4" font-family="Arial,Helvetica,sans-serif" font-size="4.05694" font-weight="bold" fill="#235875" text-anchor="start">Ko nomērīt pēc vienādas žāvēšanas</text>
<text x="18" y="141.9" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">Sausā masa; biezums centrā, pie malām un stūriem; garuma/platuma sarukums. Fotografē</text>
<text x="18" y="147.3" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">abas puses sānu gaismā: pinuma nospiedums, režģa raksts, lapu gabali un pūkainums.</text>
<text x="18" y="155.7" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">Sausiem paraugiem lieci salīdzini vienādā laidumā ar vienādu slodzes pielikšanu. Reģistrē</text>
<text x="18" y="161.1" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">plaisas un slāņu atdalīšanos. Mērījumu lapai pievieno fiziskās starpliku pakas un saspiestās</text>
<text x="18" y="166.5" font-family="Arial,Helvetica,sans-serif" font-size="3.63361" font-weight="normal" fill="#162b3b" text-anchor="start">marles biezumu; mitrā sprauga nav gatavās kartes biezums.</text>
</svg>
